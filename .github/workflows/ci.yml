name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python sources compile
        run: python -m compileall -q zpe_noise.py

      - name: Install test dependencies
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q matplotlib pytest

      - name: Tests
        env:
          MPLBACKEND: Agg
        run: pytest -q
